name: "Upload to Thunderstore and NexusMods"

on:
  release:
    types: [published]

  # Test the upload pipeline on any existing release or pre-release.
  # With dry-run (the default) nothing is uploaded: the action checks the
  # Nexus Mods API key and file ID, the Thunderstore token and team, and has
  # Thunderstore validate the zip's manifest.json.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose QuickPing.zip to test (pre-releases work too)
        required: true
      dry-run:
        description: Dry run (untick to really upload this release)
        type: boolean
        default: true

  # Called by pre-release.yml to dry-run every pre-release.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry-run:
        type: boolean
        default: true

permissions:
  contents: write # release download + commit comment

jobs:
  publish-modpackage:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: robinraju/release-downloader@v1
        with:
          tag: ${{ env.TAG }}
          fileName: QuickPing.zip

      # Thunderstore needs Major.Minor.Patch: drop a leading "v" and any
      # pre-release suffix (1.6.0-feat-x.3 -> 1.6.0).
      - name: Version
        id: version
        run: |
          v="${TAG#v}"
          echo "version=${v%%-*}" >> "$GITHUB_OUTPUT"

      # uploadMod main (dry-run merged). Switch to a release tag once one exists.
      - uses: Vodianoi/uploadMod@a2f2a6b8fb3d760cca2fe03e2745ed2bc2e6b957
        with:
          dry-run: ${{ github.event_name != 'release' && inputs.dry-run }}
          version: ${{ steps.version.outputs.version }}
          archive-file: QuickPing.zip
          file-name: QuickPing
          description: Ping what you see and pin it on the map !

          nexus-api-key: ${{ secrets.NEXUSMOD_API_KEY }}
          # File ID of the main QuickPing file (Files tab > Advanced), set as
          # repository secret NEXUS_FILE_ID (a variable of that name works too).
          nexus-file-id: ${{ secrets.NEXUS_FILE_ID || vars.NEXUS_FILE_ID }}
          nexus-category: main

          thunderstore-token: ${{ secrets.THUNDERSTORE_TOKEN }}
          thunderstore-config: thunderstore.toml
